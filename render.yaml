# Render blueprint. Also readable as documentation for any other host:
# it names the root directory, the start command and every variable required.
services:
  - type: web
    name: arli-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The API is self-contained, so the build context is the app, not the repo.
    rootDir: apps/api
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase → Project Settings → Database → Connection string → URI.
      # Set in the dashboard, never in this file.
      - key: DATABASE_URL
        sync: false
      # Required in production; the API refuses to boot without it.
      - key: CORS_ORIGINS
        sync: false
